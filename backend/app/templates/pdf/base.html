<!doctype html>
<html lang="{{ data.language.value }}">
<head>

  <title>{% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="styles/{% block stylesheet %}quotation-overseas.css{% endblock %}">
</head>
<body class="{% if compact %}compact{% endif %}">

  {% block content %}{% endblock %}
</body>
</html>
