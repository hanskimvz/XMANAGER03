# HTTP: xmanager.nicehans.com
# copy to /etc/nginx/sites-available/intranet.conf
# sudo cp nginx.xmanager.conf /etc/nginx/sites-available/xmanager.conf
# sudo ln -sf /etc/nginx/sites-available/xmanager.conf /etc/nginx/sites-enabled/xmanager.conf
# sudo systemctl restart nginx
# sudo systemctl status nginx

server {
    listen 80;
    server_name xmanager.nicehans.com;

    root /ext/xmanager/web;
    index index.html;

    # 첨부파일 업로드 한도 (backend MAX_UPLOAD_SIZE = 200MB 와 맞춤. nginx 기본값은 1MB)
    client_max_body_size 200m;
   # ==============================
    # 💥 민감한 파일 및 경로 차단
    # ==============================

    # 민감한 파일 확장자 차단
    location ~* \.(env|ya?ml|ini|php\.save)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 위험한 특정 .js 파일 이름만 차단
    location ~* /(config\.js|users\.js)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # .php 전체 차단
    location ~* \.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ASP 및 ASP.NET 계열 확장자 차단
    location ~* \.(asp|aspx|ashx|asmx|axd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 민감한 디렉토리 차단
    location ~* /(proxy|config|shared|objects)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location / {
        # try_files $uri $uri/ =404;
        try_files $uri /index.html;
    }
    # API 프록시 — 운용 API(xmanager.service)는 5197, 개발 API 는 5198 (vite 프록시가 사용)
    # ^~ : 위의 정규식 차단 규칙(/config/ 등)이 API 경로에 걸리지 않게 한다
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5197;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 구글 폰트 프록시 (옵션)
    # location /google_fonts {
    #     proxy_pass https://fonts.gstatic.com/s/;
    # }    
}

# [추가] 사내 로컬 IP 접속용 (8082 포트)
server {
    listen 8082;
    server_name 192.168.0.223;
    root /ext/xmanager/web;
    location / {
        # try_files $uri $uri/ =404;
        try_files $uri /index.html;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5197;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    
}
